<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />

  <title>statuzfree</title>

  <meta
    name="description"
    content="statuzfree — a simulated social world."
  />

  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="app-header__inner">
        <a class="brand" href="/" aria-label="statuzfree home">
          statuzfree
        </a>

        <div class="app-header__actions">
          <button
            class="icon-button"
            type="button"
            aria-label="Search"
            data-action="search"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M16.5 16.5 21 21"></path>
            </svg>
          </button>

          <button
            class="icon-button"
            type="button"
            aria-label="Settings"
            data-action="settings"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.36.34.7.6 1 .3.27.68.42 1.1.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section
        id="view-root"
        class="view-root"
        aria-live="polite"
      ></section>
    </main>

    <button
      class="compose-button"
      type="button"
      aria-label="Create post"
      data-action="compose"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 5v14"></path>
        <path d="M5 12h14"></path>
      </svg>
    </button>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a
        href="/"
        class="bottom-nav__item is-active"
        data-route="/"
        aria-label="Home"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3Z"></path>
        </svg>
        <span>Home</span>
      </a>

      <a
        href="/discover"
        class="bottom-nav__item"
        data-route="/discover"
        aria-label="Discover"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M16.5 16.5 21 21"></path>
        </svg>
        <span>Discover</span>
      </a>

      <a
        href="/messages"
        class="bottom-nav__item"
        data-route="/messages"
        aria-label="Messages"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16v11H9l-5 4Z"></path>
        </svg>
        <span>Messages</span>
      </a>

      <a
        href="/alerts"
        class="bottom-nav__item"
        data-route="/alerts"
        aria-label="Alerts"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3Z"></path>
          <path d="M10 20h4"></path>
        </svg>
        <span>Alerts</span>
      </a>

      <a
        href="/profile"
        class="bottom-nav__item"
        data-route="/profile"
        aria-label="Profile"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21a8 8 0 0 1 16 0"></path>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
